[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-collection-tracker"
version = "0.1.0"
description = "Windows-local CS2 collection price research dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]
namespaces = true
