[app]
language = "zh-CN"
host = "127.0.0.1"
port = 0
open_browser_on_start = true
continue_in_tray_after_window_close = true
timezone = "Asia/Shanghai"

[collector]
interval_minutes = 15
dashboard_refresh_minutes = 60
gap_recovery_on_start = true
max_concurrent_requests = 1

[retention]
raw_snapshot_days = 90
hourly_bar_days = 730
daily_bars_forever = true
backup_limit_mb = 2048
log_days = 30

[prices]
primary_source = "YYYP"
primary_metric = "lowest_listing"
show_highest_buy_order = true
forbid_steam = true
external_fallback_order = ["BUFF", "C5", "IGXE", "5E"]

[special_items]
allowed_wears = ["Factory New", "Minimal Wear"]
exclude_gems = true
exclude_templates = true
top_finishes_per_type = 2
ranking_wear_policy = "factory_new_then_minimal_wear"

[notifications]
enabled = false
gmail_enabled = false
discord_enabled = false
